<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=2">

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  overflow: hidden;
}

.game-area {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* container that allows scaling */
.scale-wrapper {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* zoom the actual game */
iframe {
  border: none;
  transform: scale(2);
  transform-origin: center;
}
</style>
</head>

<body>

<div class="game-area">
  <div class="scale-wrapper">
    <iframe 
      src="https://riveratorresalejandro68-commits.github.io/dome_romantik/"
      width="1200"
      height="700"
      allowfullscreen>
    </iframe>
  </div>
</div>

</body>
</html>
